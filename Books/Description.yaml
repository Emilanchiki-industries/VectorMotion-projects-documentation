Filter inputs:
  description: |
    Specifies filters input data
    Filters are custom effects built on top of builtin ones
    To use a filter provide its inputs and then go to Filter results to the needed result and export it as an image
  scenes:
    Source image:
      description: Specifies an image used as an input for Comics effect / Image filter
      usage: public
    Masked image:
      description: Specifies an image mask used as an input for Comics effect / Image filter, second step after specifying image in Source image scene
      usage: public
    Callout:
      description: Specifies a callout used as an input for Comics effect / Callout filter
      usage: public

Filter results:
  description: |
    Specifies filter results
    Export them as images to use
  scenes:
    Comics effect / Image:
      description: Specifies a result for the filter which adds a white image outline and a black shadow
      usage: public
    Comics effect / Callout:
      description: Specifies a result for the filter which adds a white callout outline and a black shadow
      usage: public

Book:
  description: Specifies book page connectors look and pages shown
  scenes:
    Raw book / Connectors:
      description: Specifies a look of 8 page connectors
      usage: internal
      layers:
        Connector 1:
          description: The 1st connector of two pages
        Connector 2:
          description: The 2nd connector of two pages
        Connector 3:
          description: The 3rd connector of two pages
        Connector 4:
          description: The 4th connector of two pages
        Connector 5:
          description: The 5th connector of two pages
        Connector 6:
          description: The 6th connector of two pages
        Connector 7:
          description: The 7th connector of two pages
        Connector 8:
          description: The 8th connector of two pages
    Raw book / 3D:
      description: Specifies a look of the book with 2 pages opened in 3D
      usage: internal
      layers:
        Cover:
          description: Specifies a look of the book cover
        Backdrop:
          description: Specifies a color under page holes (if they exist)
        Left fore edge:
          description: Specifies a look of the left book fore edge
          dependencies:
            - Book / Left fore edge
        Right fore edge:
          description: Specifies a look of the right book fore edge
          dependencies:
            - Book / Right fore edge
        Left page:
          description: Specifies a look of the left book page
          hints:
            What scenes are possible to use as a reference source?: |
              Any scenes which represent book pages like Sheet of paper 1
              By default we reference to Sheet of paper 1
          dependencies:
            - Sheet of paper 1
        Right page:
          description: Specifies a look of the right book page
          hints:
            What scenes are possible to use as a reference source?: |
              Any scenes which represent book pages like Sheet of paper 2
              By default we reference to Sheet of paper 2
          dependencies:
            - Sheet of paper 2
        Connectors:
          description: Specifies a look of page connectors
          dependencies:
            - Raw book / Connectors

Preview:
  description: Specifies a final ready-to-export book preview
  scenes:
    Book / Preview:
      description: Specifies a final ready-to-export book preview
      usage: public
      layers:
        Table:
          description: Specifies a texture of the table
        Book / Shadow:
          description: Specifies a look of the shadow casted by the book
        Book:
          description: Specifies the whole book on the table
        Pencil shadow:
          description: Specifies a look of the shadow casted by a pencil
        Pencil:
          description: Specifies a look of the pencil
        Book / Highlight:
          description: Specifies a look of highlights on the book
        Plant:
          description: Specifies a texture of a plant on the right