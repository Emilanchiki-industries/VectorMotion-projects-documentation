Patterns:
  description: Specifies different patters drawn on sheets of paper placed on white background
  scenes:
    Rows pattern:
      description: Specifies a pattern where the whole page is filled with horizontal lines
      usage: internal
      layers:
        Rows:
          description: Specifies horizontal lines
        Pre-rendered scene:
          description: Contains pre-rendered scene as an image to improve performance
    Grid pattern:
      description: Specifies a pattern where the whole page is covered with grid lines
      usage: internal
      layers:
        Rows:
          description: Specifies horizontal lines
        Columns:
          description: Specifies vertical lines
        Pre-rendered scene:
          description: Contains pre-rendered scene as an image to improve performance

Texture:
  description: Specifies different paper textures filling the whole scene
  scenes:
    Raw sheet of paper / Texture:
      description: Specifies different paper textures filling the whole scene
      usage: internal
      layers:
        Old paper:
          description: Specifies texture of old paper
        New paper:
          description: Specifies texture of new paper

Sides:
  description: Specifies left and right fore edges (sides) relative to currently opened pair of pages
  scenes:
    Book / Left fore edge:
      description: Specifies a look of the left fore edge
      usage: internal
      layers:
        Fore edge:
          description: Specifies a look of the left fore edge
          dependencies:
            - Book / Right fore edge
    Book / Right fore edge:
      description: Specifies a look of the right fore edge
      usage: internal

Page number background:
  description: Specifies a way page numbers are displayed on left and right opened pages
  scenes:
    Left page number:
      description: Specifies a way the page number is displayed on the left opened page
      usage: internal
      layers:
        Background:
          description: Specifies a background used for the page number on the left page
        Label:
          description: Specifies a label displayed beside the page number
    Right page number:
      description: Specifies a way the page number is displayed on the right opened page
      usage: internal
      layers:
        Background:
          description: Specifies a background used for the page number on the right page
        Label:
          description: Specifies a label displayed beside the page number

Temporary storage for images:
  description: Contains user added images temporarily
  scenes:
    Temporary storage for images:
      description: Contains user added images temporarily
      usage: public

Placeholders:
  description: Specifies placeholders used across the project indicating where user should add content
  scenes:
    Content placeholder:
      description: Specifies a placeholder put on two currently opened pages
      usage: internal
      layers:
        Text:
          description: Specifies the text of the placeholder

Raw pages:
  description: Specifies a way pages without content look like being on the left side from the left side
  scenes:
    Raw sheet of paper / With rows:
      description: Specifies a page with rows
      usage: internal
      layers:
        Pattern:
          description: Refers to a row pattern
          dependencies:
            - Rows pattern
        Texture:
          description: Refers to a paper texture
          dependencies:
            - Raw sheet of paper / Texture
    Raw sheet of paper / With grid:
      description: Specifies a page with grid
      usage: internal
      layers:
        Pattern:
          description: Refers to a grid pattern
          dependencies:
            - Rows pattern
        Texture:
          description: Refers to a paper texture
          dependencies:
            - Raw sheet of paper / Texture
    Raw sheet of paper / With rows and holes:
      description: Specifies a page with rows and holes
      usage: internal
      layers:
        Pattern:
          description: Refers to the page with the row pattern
          dependencies:
            - Raw sheet of paper / With rows
    Raw sheet of paper / With grid and holes:
      description: Specifies a page with grid and holes
      usage: internal
      layers:
        Pattern:
          description: Refers to the page with the grid pattern
          dependencies:
            - Raw sheet of paper / With grid

Pages:
  description: Specifies 4 pairs of pages which can be shown
  scenes:
    Sheet of paper 1:
      description: Specifies a look of the 1st page
      usage: public
      layers:
        With rows:
          description: Specifies a page design with rows
          hints:
            How to make page have this design?: Just make this layer visible and hide other 3 page design layers
        With grid:
          description: Specifies a page design with grid
          hints:
            How to make page have this design?: Just make this layer visible and hide other 3 page design layers
        With rows and holes:
          description: Specifies a page design with rows and holes
          hints:
            How to make page have this design?: Just make this layer visible and hide other 3 page design layers
        With grid and holes:
          description: Specifies a page design with grid and holes
          hints:
            How to make page have this design?: Just make this layer visible and hide other 3 page design layers
        Page number / Background:
          description: Specifies a page number background with label
          dependencies:
            - Left page number
        Page number:
          description: Specifies the page number
        Placeholder:
          description: Specifies a placeholder to let user know that a content is expected to be placed on this page
          hints:
            Is it safe to remove placeholder?: Absolutely, it's just a regular layer, remove it when you add content
